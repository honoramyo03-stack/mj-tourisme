<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle radial glow -->
  <circle cx="256" cy="220" r="180" fill="#fbbf24" opacity="0.3" filter="blur(30px)" />

  <!-- Ravinala Fan / Traveler's Palm motif -->
  <g filter="url(#shadow)" transform="translate(256, 320)">
    <!-- Central trunk -->
    <path d="M -16,40 L -12,110 L 12,110 L 16,40 Z" fill="#78350f" rx="6" />

    <!-- Palm Fan Fronds radiating out symmetrically -->
    <!-- Center frond -->
    <path d="M 0,20 C -12,-80 -8,-170 0,-210 C 8,-170 12,-80 0,20 Z" fill="url(#leafGrad)" />
    <!-- Layer 1 left & right -->
    <path d="M -5,20 C -35,-60 -55,-145 -45,-195 C -30,-160 -15,-80 -5,20 Z" fill="url(#leafGrad)" opacity="0.95" />
    <path d="M 5,20 C 35,-60 55,-145 45,-195 C 30,-160 15,-80 5,20 Z" fill="url(#leafGrad)" opacity="0.95" />

    <!-- Layer 2 left & right -->
    <path d="M -8,25 C -65,-40 -115,-105 -100,-160 C -80,-130 -40,-60 -8,25 Z" fill="url(#leafGrad)" opacity="0.9" />
    <path d="M 8,25 C 65,-40 115,-105 100,-160 C 80,-130 40,-60 8,25 Z" fill="url(#leafGrad)" opacity="0.9" />

    <!-- Layer 3 left & right -->
    <path d="M -10,30 C -95,-15 -170,-60 -155,-115 C -130,-90 -65,-30 -10,30 Z" fill="url(#leafGrad)" opacity="0.85" />
    <path d="M 10,30 C 95,-15 170,-60 155,-115 C 130,-90 65,-30 10,30 Z" fill="url(#leafGrad)" opacity="0.85" />

    <!-- Layer 4 lower left & right -->
    <path d="M -12,35 C -120,5 -205,-15 -195,-60 C -170,-45 -95,-5 -12,35 Z" fill="url(#leafGrad)" opacity="0.8" />
    <path d="M 12,35 C 120,5 205,-15 195,-60 C 170,-45 95,-5 12,35 Z" fill="url(#leafGrad)" opacity="0.8" />

    <!-- Base rosette clasp -->
    <circle cx="0" cy="35" r="22" fill="#92400e" />
    <circle cx="0" cy="35" r="14" fill="#fbbf24" />
  </g>

  <!-- Stylized Monogram 'R' overlay / traveler compass badge -->
  <g transform="translate(256, 420)">
    <rect x="-80" y="-24" width="160" height="48" rx="24" fill="#1c1917" opacity="0.9" filter="url(#shadow)" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="3">RAVINALA</text>
  </g>
</svg>
